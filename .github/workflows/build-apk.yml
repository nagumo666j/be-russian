name: Build Be Russian APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q Be-Russian.zip -d .
          test -f BeRussian/app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # تثبيت الحزم المطلوبة وقبول التراخيص دفعة واحدة لضمان الاستقرار
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p BeRussian assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Be-Russian-APK
          path: BeRussian/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
